[tool.ruff]
target-version = "py312"
line-length = 100
indent-width = 4
extend-exclude = ["migrations", "alembic", "venv", ".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = []
per-file-ignores = { "backend/migrations/versions/*.py" = ["F401"], "backend/tests/conftest.py" = ["E402"], "backend/scripts/inspect_migrations.py" = ["E402"], "backend/tests/test_apply_transformation.py" = ["E402"] }

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.12"
files = ["backend/app"]
ignore_missing_imports = true
follow_imports = "silent"
disable_error_code = ["import-untyped"]
show_error_codes = true
exclude = '''(^backend/migrations/|^backend/.*/(temp|tmp|debug)[^/]*\.py$)'''
