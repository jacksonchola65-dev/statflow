version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "09:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 2
    groups:
      patch-updates:
        patterns:
          - "*"
        update-types:
          - "version-update:semver-patch"
      minor-updates:
        patterns:
          - "*"
        update-types:
          - "version-update:semver-minor"
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "09:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 2
    groups:
      patch-updates:
        patterns:
          - "*"
        update-types:
          - "version-update:semver-patch"
      minor-updates:
        patterns:
          - "*"
        update-types:
          - "version-update:semver-minor"
