name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend-validation:
    name: Backend validation
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/backend
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/statflow
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/statflow_test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: statflow_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d statflow_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Cache Python dependencies
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Run Ruff checks
        run: |
          set +e
          {
            echo "python --version"
            python --version
            echo "python -m ruff --version"
            python -m ruff --version
            echo "pwd"
            pwd
            echo "ls -la"
            ls -la .
            echo "python -m ruff check . --output-format=full"
            python -m ruff check . --output-format=full
            ruff_check_rc=$?
            echo "python -m ruff format --check ."
            python -m ruff format --check .
            ruff_format_rc=$?
            if [ $ruff_check_rc -ne 0 ]; then
              exit $ruff_check_rc
            fi
            exit $ruff_format_rc
          } > ruff-ci.log 2>&1
      - name: Upload Ruff diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ruff-ci-diagnostics
          path: |
            ruff-ci.log
            pyproject.toml
          if-no-files-found: warn
      - name: Run MyPy checks
        run: |
          python -m mypy backend/app
      - name: Run backend tests
        run: |
          cd backend
          set -o pipefail
          python -m pytest -m "not performance" --cov=app --cov-report=term-missing --cov-report=xml:coverage.xml \
            --junitxml=backend-pytest-report.xml 2>&1 | tee backend-pytest.log
      - name: Upload backend pytest diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: backend-pytest-diagnostics
          path: |
            backend/backend-pytest.log
            backend/backend-pytest-report.xml
            backend/coverage.xml
          if-no-files-found: warn

  frontend-validation:
    name: Frontend validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: |
          set +e
          cd frontend
          {
            echo "node --version"
            node --version
            echo "npm --version"
            npm --version
            echo "pwd"
            pwd
            echo "npm ci"
            npm ci
          } 2>&1 | tee frontend-ci.log
          npm_ci_rc=${PIPESTATUS[0]}
          echo "npm ci exit code: $npm_ci_rc"
          exit $npm_ci_rc
      - name: Run frontend lint
        run: |
          set +e
          cd frontend
          {
            echo "npm run lint"
            npm run lint
          } 2>&1 | tee -a frontend-ci.log
          npm_lint_rc=${PIPESTATUS[0]}
          echo "npm run lint exit code: $npm_lint_rc"
          exit $npm_lint_rc
      - name: Run frontend tests
        run: |
          set +e
          cd frontend
          {
            echo "npm test"
            npm test
          } 2>&1 | tee -a frontend-ci.log
          npm_test_rc=${PIPESTATUS[0]}
          echo "npm test exit code: $npm_test_rc"
          exit $npm_test_rc
      - name: Build frontend
        run: |
          set +e
          cd frontend
          {
            echo "npm run build"
            npm run build
          } 2>&1 | tee -a frontend-ci.log
          npm_build_rc=${PIPESTATUS[0]}
          echo "npm run build exit code: $npm_build_rc"
          exit $npm_build_rc
      - name: frontend-ci-diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: frontend-ci-diagnostics
          path: |
            frontend/frontend-ci.log
            frontend/package.json
            frontend/package-lock.json
          if-no-files-found: error
