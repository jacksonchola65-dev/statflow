name: "npm audit (frontend)"

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * 0' # weekly on Sundays at 00:00 UTC

permissions:
  contents: read

jobs:
  audit:
    name: npm audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit (fail on >= moderate)
        run: |
          # preserve exact exit code from npm audit while saving output
          npm audit --audit-level=moderate | tee npm-audit-report.txt
          exit ${PIPESTATUS[0]}

      - name: Upload npm-audit report on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: npm-audit-report
          path: frontend/npm-audit-report.txt
