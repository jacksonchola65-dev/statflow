repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.0
    hooks:
      - id: ruff
        name: ruff-format
        args: [format, --config=pyproject.toml]
        additional_dependencies: [ruff==0.12.0]
        files: '^backend/.*\\.py$'
      - id: ruff
        name: ruff-check
        args: [check, --config=pyproject.toml]
        additional_dependencies: [ruff==0.12.0]
        files: '^backend/.*\\.py$'

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.15.0
    hooks:
      - id: mypy
        name: mypy-backend-app
        args: [backend/app]
        additional_dependencies: [mypy==1.15.0]
        pass_filenames: false
        stages: [pre-push]
        always_run: true
